<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VEE-PLUS Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
    }
    .pagination-btn.active {
      background-color: #EFF6FF;
      border-color: #3B82F6;
      color: #3B82F6;
    }
    /* Styles for the Edit Modal */
    .modal-overlay {
        transition: opacity 0.3s ease;
    }
    .modal-container {
        transition: transform 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-100">
  <!-- Admin Header -->
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4 border-b border-gray-200">
        <div class="flex items-center space-x-4">
          <h1 class="text-xl font-semibold text-gray-900">VEE-PLUS Admin</h1>
          <nav class="hidden md:flex space-x-8" id="mainNav">
            <a href="#" class="text-blue-600 border-b-2 border-blue-600 px-1 pb-2 text-sm font-medium">Receipts</a>
            <a href="#" class="text-gray-500 hover:text-gray-700 px-1 pb-2 text-sm font-medium">Reports</a>
            <a href="#" class="text-gray-500 hover:text-gray-700 px-1 pb-2 text-sm font-medium">Users</a>
          </nav>
        </div>
        <div class="flex items-center space-x-4">
          <div class="flex items-center">
            <div class="ml-3 text-right">
              <p class="text-sm font-medium text-gray-700">Admin User</p>
              <p class="text-xs font-medium text-gray-500">Administrator</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Receipt Records Table -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Receipt Records</h1>
      <div class="flex space-x-3">
        <div class="relative inline-block text-left">
          <div>
            <button type="button" class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" id="export-menu-button" aria-expanded="false" aria-haspopup="true">
              Export
              <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          <div class="hidden origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-10" role="menu" aria-orientation="vertical" aria-labelledby="export-menu-button" tabindex="-1" id="export-menu">
            <div class="py-1" role="none">
                <a href="#" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem" tabindex="-1" id="export-excel">Export to Excel</a>
                <a href="#" class="text-gray-700 block px-4 py-2 text-sm hover:bg-gray-100" role="menuitem" tabindex="-1" id="export-pdf">Export to PDF</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <div class="p-4 flex flex-wrap md:flex-nowrap items-center justify-between gap-4">
            <!-- Search Input -->
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                </svg>
              </div>
              <input type="text" id="searchInput"
                class="pl-10 pr-3 py-2 border border-gray-300 rounded-md text-sm w-full sm:w-64 focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400"
                placeholder="Search records..." />
            </div>
          
            <div class="flex items-center gap-2">
              <span class="text-sm text-gray-500">Show</span>
              <select class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md" id="perPageSelect">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>
          </div>
          
      <div class="overflow-x-auto">
        <div class="min-w-full overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Model</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IMEI</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
            <!-- NEW: Actions Column Header -->
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="adminTableBody" class="bg-white divide-y divide-gray-200">
          <!-- Data will be injected here -->
        </tbody>
          </table>
        </div>
      </div>
      <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
        <div class="flex-1 flex justify-between sm:hidden">
            <a href="#" id="prevPageMobile" class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"> Previous </a>
            <a href="#" id="nextPageMobile" class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"> Next </a>
        </div>
        <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
          <div>
            <p class="text-sm text-gray-700" id="paginationInfo">
              Showing <span class="font-medium">1</span> to <span class="font-medium">10</span> of <span class="font-medium">0</span> results
            </p>
          </div>
          <div>
            <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination" id="paginationNav">
            </nav>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- NEW: Edit Record Modal -->
  <div id="editModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50 hidden modal-overlay">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl p-6 modal-container transform scale-95">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="text-lg font-bold text-gray-800">Edit Receipt Record</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
        </div>
        <form id="editForm" class="space-y-4">
            <input type="hidden" id="editReceiptNo">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="editCustomerName" class="block text-sm font-medium text-gray-700">Customer Name</label>
                    <input type="text" id="editCustomerName" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="editCustomerPhone" class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="editCustomerPhone" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="editModel" class="block text-sm font-medium text-gray-700">Model</label>
                    <input type="text" id="editModel" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="editImei" class="block text-sm font-medium text-gray-700">IMEI</label>
                    <input type="text" id="editImei" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="editTotal" class="block text-sm font-medium text-gray-700">Total Amount</label>
                    <input type="number" id="editTotal" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                 <div>
                    <label for="editUser" class="block text-sm font-medium text-gray-700">User</label>
                    <input type="text" id="editUser" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button type="button" id="cancelEditBtn" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-md font-medium hover:bg-gray-300 transition">Cancel</button>
                <button type="submit" class="bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition">Save Changes</button>
            </div>
        </form>
    </div>
  </div>

  <script>
    // Export functionality (no changes needed)
    const exportMenuButton = document.getElementById('export-menu-button');
    const exportMenu = document.getElementById('export-menu');
    exportMenuButton.addEventListener('click', () => exportMenu.classList.toggle('hidden'));
    document.addEventListener('click', (event) => {
      if (!exportMenu.contains(event.target) && !exportMenuButton.contains(event.target)) {
        exportMenu.classList.add('hidden');
      }
    });
    document.getElementById('export-excel').addEventListener('click', (e) => {
      e.preventDefault();
      const ws = XLSX.utils.json_to_sheet(filteredData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Receipts");
      XLSX.writeFile(wb, `receipts_export_${new Date().toISOString()}.xlsx`);
      exportMenu.classList.add('hidden');
    });
    document.getElementById('export-pdf').addEventListener('click', (e) => {
      e.preventDefault();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape' });
      doc.autoTable({
        head: [['Name', 'Phone', 'Model', 'IMEI', 'Total', 'Date', 'User']],
        body: filteredData.map(item => [item.name, item.phone, item.model, item.imei, `Ksh ${parseFloat(item.total || 0).toLocaleString()}`, item.date, item.user]),
      });
      doc.save(`receipts_export_${new Date().toISOString()}.pdf`);
      exportMenu.classList.add('hidden');
    });


    // --- Main Data Handling Logic ---
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    let itemsPerPage = 10;
    const searchInput = document.getElementById('searchInput');
    const perPageSelect = document.getElementById('perPageSelect');
    const SHEETDB_URL = "https://sheetdb.io/api/v1/whim74m5dy6u6";

    function renderTable() {
      const table = document.getElementById("adminTableBody");
      table.innerHTML = "";
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedData = filteredData.slice(startIndex, endIndex);

      paginatedData.forEach(entry => {
        const receiptNo = entry.receipt_no || '';
        const row = `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${entry.name || ''}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${entry.phone || ''}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${entry.model || ''}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${entry.imei || ''}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Ksh ${parseFloat(entry.total || 0).toLocaleString()}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${entry.date || ''}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">${entry.user || ''}</span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <button onclick="openEditModal('${receiptNo}')" class="text-indigo-600 hover:text-indigo-900" title="Edit"><i class="fas fa-edit"></i></button>
                <button onclick="deleteRecord('${receiptNo}')" class="text-red-600 hover:text-red-900 ml-4" title="Delete"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `;
        table.insertAdjacentHTML("beforeend", row);
      });
    }

    function setupPagination() {
        const paginationNav = document.getElementById('paginationNav');
        const paginationInfo = document.getElementById('paginationInfo');
        paginationNav.innerHTML = '';
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        const prevBtn = document.createElement('a');
        prevBtn.href = '#';
        prevBtn.className = 'relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50';
        prevBtn.innerHTML = '<span class="sr-only">Previous</span><i class="fas fa-chevron-left h-5 w-5"></i>';
        prevBtn.onclick = (e) => { e.preventDefault(); if(currentPage > 1) goToPage(currentPage - 1); };
        paginationNav.appendChild(prevBtn);

        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('a');
            pageBtn.href = '#';
            pageBtn.className = `relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium pagination-btn ${i === currentPage ? 'active' : 'text-gray-700 hover:bg-gray-50'}`;
            pageBtn.textContent = i;
            pageBtn.onclick = (e) => { e.preventDefault(); goToPage(i); };
            paginationNav.appendChild(pageBtn);
        }

        const nextBtn = document.createElement('a');
        nextBtn.href = '#';
        nextBtn.className = 'relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50';
        nextBtn.innerHTML = '<span class="sr-only">Next</span><i class="fas fa-chevron-right h-5 w-5"></i>';
        nextBtn.onclick = (e) => { e.preventDefault(); if(currentPage < totalPages) goToPage(currentPage + 1); };
        paginationNav.appendChild(nextBtn);

        const startItem = filteredData.length > 0 ? (currentPage - 1) * itemsPerPage + 1 : 0;
        const endItem = Math.min(currentPage * itemsPerPage, filteredData.length);
        paginationInfo.innerHTML = `Showing <span class="font-medium">${startItem}</span> to <span class="font-medium">${endItem}</span> of <span class="font-medium">${filteredData.length}</span> results`;
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
        setupPagination();
    }

    searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        filteredData = allData.filter(entry => 
            Object.values(entry).some(val => 
                String(val).toLowerCase().includes(searchTerm)
            )
        );
        goToPage(1);
    });

    perPageSelect.addEventListener('change', (e) => {
        itemsPerPage = parseInt(e.target.value);
        goToPage(1);
    });

    async function loadAdminData() {
      try {
        const res = await fetch(SHEETDB_URL);
        allData = await res.json();
        allData.forEach(item => item.total = parseFloat(item.total) || 0);
        filteredData = [...allData];
        goToPage(1);
      } catch (err) {
        console.error("❌ Failed to load data:", err);
      }
    }
    
    // --- NEW: CRUD Functionality ---
    const editModal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    window.openEditModal = (receiptNo) => {
        const record = allData.find(item => item.receipt_no === receiptNo);
        if (!record) {
            alert('Record not found!');
            return;
        }
        
        // Populate the modal form
        document.getElementById('editReceiptNo').value = record.receipt_no;
        document.getElementById('editCustomerName').value = record.name || '';
        document.getElementById('editCustomerPhone').value = record.phone || '';
        document.getElementById('editModel').value = record.model || '';
        document.getElementById('editImei').value = record.imei || '';
        document.getElementById('editTotal').value = record.total || 0;
        document.getElementById('editUser').value = record.user || '';

        editModal.classList.remove('hidden');
    };

    const closeEditModal = () => {
        editModal.classList.add('hidden');
    };
    closeModalBtn.addEventListener('click', closeEditModal);
    cancelEditBtn.addEventListener('click', closeEditModal);

    editForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const receiptNo = document.getElementById('editReceiptNo').value;
        const updatedData = {
            name: document.getElementById('editCustomerName').value,
            phone: document.getElementById('editCustomerPhone').value,
            model: document.getElementById('editModel').value,
            imei: document.getElementById('editImei').value,
            total: document.getElementById('editTotal').value,
            user: document.getElementById('editUser').value,
        };

        try {
            const response = await fetch(`${SHEETDB_URL}/receipt_no/${receiptNo}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: updatedData })
            });
            if (!response.ok) throw new Error('Failed to update record.');
            
            alert('Record updated successfully!');
            closeEditModal();
            loadAdminData(); // Reload data to show changes
        } catch (error) {
            alert(`Error updating record: ${error.message}`);
        }
    });

    window.deleteRecord = async (receiptNo) => {
        if (!confirm(`Are you sure you want to delete receipt ${receiptNo}? This action cannot be undone.`)) {
            return;
        }

        try {
            const response = await fetch(`${SHEETDB_URL}/receipt_no/${receiptNo}`, {
                method: 'DELETE',
            });
            if (!response.ok) throw new Error('Failed to delete record.');
            
            alert('Record deleted successfully!');
            loadAdminData(); // Reload data to show changes
        } catch (error) {
            alert(`Error deleting record: ${error.message}`);
        }
    };

    document.addEventListener("DOMContentLoaded", loadAdminData());
  </script>
</body>
</html>
